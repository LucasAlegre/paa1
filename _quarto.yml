project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "aulas/*.qmd"
    - "!aulas-projeto-e-analise-de-algoritmos/"

website:
  title: "Projeto e Análise de Algoritmos I - INF UFRGS"
  favicon: favicon.ico
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: exercicios.qmd
        text: Exercícios
      - href: programacao.qmd
        text: Programação
    right:
      - icon: github
        href: https://github.com/BrunoGrisci/projeto-e-analise-de-algoritmos
        aria-label: GitHub
        text: Códigos

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    include-in-header:
      - text: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">'
    include-after-body: _footer.html
