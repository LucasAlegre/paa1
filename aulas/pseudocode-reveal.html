<style>
/* ── Pseudocode line interaction for RevealJS ─────────────────────────── */

/* hide "procedure" / "function" keyword — keep only the name + params   */
.ps-keyword:has(~ .ps-funcname),
.ps-line:has(.ps-funcname) .ps-keyword {
  display: none !important;
}

/* Hide line number and reset indent on procedure/function header line */
.ps-line:has(.ps-funcname) .ps-linenum {
  display: none !important;
}
.ps-line:has(.ps-funcname) {
  text-indent: 0 !important;
}

/* ── Border: top+bottom rule (CLRS style) when used without \begin{algorithm} */
.pseudocode-container:not(:has(.ps-algorithm)) .ps-root {
  border-top: 2px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  padding: 0.35em 0.1em;
}

/* ── Size-control wrapper classes ─────────────────────────────────────── *
 *  Usage in the slide:                                                    *
 *    ::: {.pc-xs}                                                         *
 *    ```pseudocode                                                         *
 *    ...                                                                   *
 *    ```                                                                   *
 *    :::                                                                   *
 *                                                                          *
 *  Or use an inline style directly on the slide block:                    *
 *    ::: {style="font-size: 0.7em"}                                       *
 * ──────────────────────────────────────────────────────────────────────── */
.pc-xs .ps-root { font-size: 0.60em; }
.pc-sm .ps-root { font-size: 0.75em; }
.pc-md .ps-root { font-size: 0.90em; }
.pc-lg .ps-root { font-size: 1.15em; }

/* Auto-fit measures sizes right away: no animated font-size changes then. */
.autofit-measuring, .autofit-measuring * { transition: none !important; }

/* make every content line hoverable/clickable */
.ps-algorithmic .ps-line {
  cursor: pointer;
  border-left: 3px solid transparent;
  border-radius: 2px;
  padding-left: 2px;
  padding-right: 4px;
  transition: background-color 0.12s ease, border-left-color 0.12s ease;
}

.ps-algorithmic .ps-line:hover {
  background-color: rgba(66, 133, 244, 0.10);
}

/* manually highlighted line (click or L key) */
.ps-algorithmic .ps-line.ps-line-active {
  background-color: rgba(255, 214, 0, 0.42) !important;
  border-left-color: #e6a800 !important;
}

/* ── Step-through mode (.step-through wrapper) ────────────────────────── */
/* dim already-passed lines; current fragment gets the yellow highlight   */
.step-through .ps-algorithmic .ps-line.fragment        { opacity: 0.30; }
.step-through .ps-algorithmic .ps-line.fragment.visible { opacity: 1;   }
.step-through .ps-algorithmic .ps-line.fragment.current-fragment {
  opacity: 1;
  background-color: rgba(255, 214, 0, 0.42);
  border-left-color: #e6a800;
}
</style>

<script>
/* ── Pseudocode & KaTeX Math Enhancements for RevealJS ────────────────── *
 *                                                                          *
 *  CLICK    a line  →  toggle amber highlight                              *
 *  L key            →  move highlight to NEXT line in current slide       *
 *  Shift+L key      →  move highlight to PREVIOUS line                    *
 *  Slide change     →  clear highlight & re-apply math colors             *
 * ──────────────────────────────────────────────────────────────────────── */
(function () {
  "use strict";

  var active = null; /* currently highlighted .ps-line element */

  /* ── helpers ─────────────────────────────────────────────────────────── */
  function activate(line) {
    if (active) active.classList.remove("ps-line-active");
    active = line || null;
    if (active) active.classList.add("ps-line-active");
  }

  function linesInCurrentSlide() {
    var slide =
      document.querySelector(".reveal .slides section.present:not(.stack)") ||
      document.querySelector(".reveal .slides section.present");
    if (!slide) return [];
    return Array.from(slide.querySelectorAll(".ps-algorithmic .ps-line:not(:has(.ps-funcname))"));
  }

  function fixLineNumbers() {
    document.querySelectorAll(".ps-algorithmic").forEach(function (alg) {
      var headerNum = alg.querySelector(".ps-line:has(.ps-funcname) .ps-linenum");
      if (headerNum) {
        headerNum.remove();
      }
      var headerLine = alg.querySelector(".ps-line:has(.ps-funcname)");
      if (headerLine) {
        headerLine.style.textIndent = "0px";
      }

      var punc = ":";
      var container = alg.closest(".pseudocode-container");
      if (container && container.dataset && container.dataset.lineNumberPunc) {
        punc = container.dataset.lineNumberPunc;
      }

      var lineNums = alg.querySelectorAll(".ps-line:not(:has(.ps-funcname)) .ps-linenum");
      lineNums.forEach(function (span, idx) {
        span.textContent = (idx + 1) + punc;
      });
    });
  }

  function colorizeMath() {
    document.querySelectorAll(".katex-html").forEach(function (math) {
      // 1. Asymptotic symbols O, \Theta, \Omega -> Black
      math.querySelectorAll(".mord").forEach(function (el) {
        var txt = el.textContent.trim();
        if (txt === "O" || txt === "Θ" || txt === "Ω") {
          el.style.color = "#000000";
          el.style.fontWeight = "700";
        }
      });

      // 2. Math variables (only .mathnormal, and NEVER inside \text{...})
      math.querySelectorAll(".mord.mathnormal").forEach(function (el) {
        if (el.closest(".text") || el.classList.contains("text")) return;

        var txt = el.textContent.trim();
        if (txt === "i") {
          el.style.color = "#15803d"; // Green for index i
          el.style.fontWeight = "600";
        } else if (txt === "j") {
          el.style.color = "#1d4ed8"; // Dark Blue for index j
          el.style.fontWeight = "600";
        }
      });
    });
  }

  function resizeAllCytoscape() {
    document.querySelectorAll("div").forEach(function (el) {
      if (el._cyreg && el._cyreg.cy && el.offsetWidth > 0) {
        el._cyreg.cy.resize();
      }
    });
  }

  function refreshAll() {
    fixLineNumbers();
    colorizeMath();
    resizeAllCytoscape();
  }

  /* ── click to toggle highlight ───────────────────────────────────────── */
  document.addEventListener("click", function (e) {
    var line = e.target.closest(".ps-algorithmic .ps-line");
    if (!line) {
      /* click outside pseudocode block → clear */
      if (active && !e.target.closest(".ps-root")) activate(null);
      return;
    }
    activate(active === line ? null : line);
  });

  /* ── L / Shift+L keyboard stepping ──────────────────────────────────── */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "l" && e.key !== "L") return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

    var lines = linesInCurrentSlide();
    if (!lines.length) return;

    var idx = active ? lines.indexOf(active) : -1;

    if (e.shiftKey) {
      /* backward: Shift+L */
      idx = idx <= 0 ? -1 : idx - 1;
    } else {
      /* forward: L */
      idx = Math.min(idx + 1, lines.length - 1);
    }

    activate(idx >= 0 ? lines[idx] : null);
    e.preventDefault();
    e.stopPropagation();
  });

  /* ── fragment-based step-through (.step-through containers) ─────────── */
  function enableStepThrough() {
    document
      .querySelectorAll(".step-through .ps-algorithmic .ps-line")
      .forEach(function (line) {
        line.classList.add("fragment");
      });
    if (typeof Reveal !== "undefined" && typeof Reveal.sync === "function") {
      Reveal.sync();
    }
  }

  /* ── Auto-fit overflowing slides ────────────────────────────────────── */
  function autoFitSlide(slide) {
    if (!slide || 
        slide.classList.contains("title-slide") || 
        slide.classList.contains("has-dark-background") ||
        slide.classList.contains("scrollable") ||
        slide.classList.contains("live-code-slide")) {
      return;
    }

    // Never re-fit a slide that has already been fitted
    if (slide.dataset.autofitDone === "true") return;
    if (slide.scrollHeight === 0 && slide.clientHeight === 0) return;

    // Measure only after the web fonts (Lexend, KaTeX) are loaded: fallback
    // fonts have different metrics and would make the slide shrink too much.
    if (document.fonts && document.fonts.status !== "loaded") {
      if (slide.dataset.autofitWaiting !== "true") {
        slide.dataset.autofitWaiting = "true";
        document.fonts.ready.then(function () {
          slide.dataset.autofitWaiting = "";
          autoFitSlide(slide);
        });
      }
      return;
    }

    // Same for math: raw $$...$$ text is much taller than the rendered KaTeX.
    var pendingMath = Array.prototype.some.call(slide.querySelectorAll("span.math"), function (el) {
      return !el.querySelector(".katex");
    });
    if (pendingMath && (Number(slide.dataset.autofitTries) || 0) < 30) {
      slide.dataset.autofitTries = (Number(slide.dataset.autofitTries) || 0) + 1;
      setTimeout(function () { autoFitSlide(slide); }, 100);
      return;
    }

    var configHeight = (typeof Reveal !== "undefined" && typeof Reveal.getConfig === "function" && Reveal.getConfig().height) || 768;
    var maxH = configHeight - 8;

    // Height actually used by the content (the section itself may have a
    // fixed height, so slide.scrollHeight never drops below it).
    // Measured from the rendered boxes, undoing Reveal's scale transform.
    function contentHeight() {
      var box = slide.getBoundingClientRect();
      var k = slide.offsetHeight ? box.height / slide.offsetHeight : 1;
      if (!k) k = 1;
      var bottom = 0;
      Array.prototype.forEach.call(slide.children, function (child) {
        var r = child.getBoundingClientRect();
        if (!r.height) return;
        var mb = parseFloat(getComputedStyle(child).marginBottom) || 0;
        bottom = Math.max(bottom, (r.bottom - box.top) / k + mb);
      });
      return bottom;
    }

    // Reveal animates fragments (transition: all), so their font-size would
    // lag behind the slide's while we measure.
    slide.classList.add("autofit-measuring");
    slide.style.fontSize = "";
    if (contentHeight() > maxH) {
      // Largest scale in [0.70, 1] that fits (binary search): not every
      // element scales with the font, so a single ratio shrinks too much.
      var lo = 0.70, hi = 1.0;
      for (var i = 0; i < 8; i++) {
        var mid = (lo + hi) / 2;
        slide.style.fontSize = (mid * 100).toFixed(1) + "%";
        if (contentHeight() > maxH) hi = mid; else lo = mid;
      }
      slide.style.fontSize = (lo * 100).toFixed(1) + "%";
    }
    void slide.offsetHeight;
    slide.classList.remove("autofit-measuring");
    slide.dataset.autofitDone = "true";
  }

  // Re-fits every time the slide is shown: right after loading the layout is
  // not settled yet, so a fit computed then can be far too small.
  function handleAutoFit(slide) {
    var target = slide || (typeof Reveal !== "undefined" && typeof Reveal.getCurrentSlide === "function" ? Reveal.getCurrentSlide() : null);
    if (!target) return;
    target.dataset.autofitDone = "";
    target.dataset.autofitTries = "";
    autoFitSlide(target);
  }

  /* ── clear highlight, refresh math colors & auto-fit on slide change ──── */
  function onSlideChanged(event) {
    activate(null);
    refreshAll();
    var current = (event && event.currentSlide) || (typeof Reveal !== "undefined" && typeof Reveal.getCurrentSlide === "function" ? Reveal.getCurrentSlide() : null);
    handleAutoFit(current);
    setTimeout(refreshAll, 50);
    setTimeout(refreshAll, 150);
  }

  /* ── only refresh colors on fragment step (never re-fit slide) ───────── */
  function onFragmentChanged() {
    refreshAll();
  }

  /* ── bootstrap: wait for Reveal to be ready ─────────────────────────── */
  function bootstrap() {
    refreshAll();
    if (typeof Reveal === "undefined") return;

    function onReady() {
      enableStepThrough();
      refreshAll();
      handleAutoFit();
      // Fit the first slide shown again once the page has fully settled.
      var refitFirst = function () { setTimeout(function () { handleAutoFit(); }, 400); };
      if (document.readyState === "complete") refitFirst();
      else window.addEventListener("load", refitFirst);

      if (window.location.search.indexOf("print-pdf") !== -1) {
        document.querySelectorAll(".reveal .slides section").forEach(function (s) {
          autoFitSlide(s);
        });
      }

      Reveal.on("slidechanged", onSlideChanged);
      Reveal.on("fragmentshown", onFragmentChanged);
      Reveal.on("fragmenthidden", onFragmentChanged);
    }

    if (Reveal.isReady()) {
      onReady();
    } else {
      Reveal.on("ready", onReady);
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    bootstrap();
    setTimeout(refreshAll, 0);
    setTimeout(refreshAll, 100);
    setTimeout(refreshAll, 300);
    setTimeout(refreshAll, 600);
  });
})();
</script>
